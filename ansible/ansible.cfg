[defaults]
inventory = inventory/aws_ec2.yml
roles_path = roles
forks = 10
interpreter_python = auto_silent
retry_files_enabled = False
# Every run is logged with timestamps and host names, for troubleshooting.
log_path = ~/ansible.log
# Fail any task that runs longer than 30 minutes instead of hanging forever.
task_timeout = 1800
# Vault password comes from SSM through control01's instance role (D-043).
vault_password_file = scripts/vault-password.py

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
# Keepalives detect a dead connection in about a minute.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=4