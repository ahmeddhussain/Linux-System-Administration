---
- name: Install baseline packages
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present

- name: Set the timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ base_timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Enable and start time synchronization
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: started

- name: Keep SELinux enforcing
  ansible.posix.selinux:
    policy: targeted
    state: enforcing

- name: Enable and start the host firewall
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

# systemd reports firewalld started before it has loaded its configuration,
# and the firewalld module fails if called in that gap (seen on a freshly
# built gw01). Wait until it answers.
- name: Wait until the host firewall is ready
  ansible.builtin.command: firewall-cmd --state
  register: base_firewalld_state
  until: base_firewalld_state.rc == 0
  retries: 15
  delay: 2
  changed_when: false
  check_mode: false

- name: Keep SSH allowed in the host firewall
  ansible.posix.firewalld:
    service: ssh
    permanent: true
    immediate: true
    state: enabled

- name: Install the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-ahmed-hardening.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart sshd

- name: Validate the complete sshd configuration before any restart
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false

# The same text for network and console logins; no OS details, which the
# stock /etc/issue shows (banner_etc_issue_cis, D-064).
- name: Install the pre-login banner
  ansible.builtin.template:
    src: issue.net.j2
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/issue.net
    - /etc/issue

- name: Install the post-login message
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"