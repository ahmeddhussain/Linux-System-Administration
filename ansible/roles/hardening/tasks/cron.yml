---
# file_permissions_crontab, file_permissions_cron_{d,hourly,daily,weekly,monthly}
- name: Only root reads the system crontab
  ansible.builtin.file:
    path: /etc/crontab
    owner: root
    group: root
    mode: "0600"

- name: Only root reads the cron directories
  ansible.builtin.file:
    path: "/etc/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: [cron.d, cron.hourly, cron.daily, cron.weekly, cron.monthly]

# file_cron_allow_exists, file_cron_deny_not_exist, file_at_allow_exists:
# an empty allow list means only root may schedule jobs.
- name: Allow lists for cron and at (empty, root only)
  ansible.builtin.copy:
    dest: "/etc/{{ item }}"
    content: ""
    force: false
    owner: root
    group: root
    mode: "0640"
  loop: [cron.allow, at.allow]

- name: No deny list (the allow list decides)
  ansible.builtin.file:
    path: /etc/cron.deny
    state: absent
