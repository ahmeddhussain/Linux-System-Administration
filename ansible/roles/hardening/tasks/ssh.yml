---
# file_permissions_sshd_drop_in_config: every sshd drop-in root-only,
# including those IPA (04-ipa.conf), cloud-init and the OS install. Here, not
# in base, because IPA writes its drop-in after base has run.
- name: Find the sshd drop-ins
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    patterns: "*.conf"
  register: hardening_sshd_dropins

- name: Make every sshd drop-in root-only
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ hardening_sshd_dropins.files }}"
  loop_control:
    label: "{{ item.path }}"

# sshd_disable_gssapi_auth and INC-007: our 01- drop-in already wins, but
# the scanner reads every file, and a later rename must not bring
# password or GSSAPI logins back. Make IPA's and the OS's drop-ins agree.
- name: No GSSAPI or keyboard-interactive in any sshd drop-in
  ansible.builtin.replace:
    path: "{{ item.0.path }}"
    regexp: '^(\s*{{ item.1 }})\s+yes\s*$'
    replace: '\1 no'
  loop: "{{ hardening_sshd_dropins.files | product(['GSSAPIAuthentication', 'ChallengeResponseAuthentication', 'KbdInteractiveAuthentication']) | list }}"
  loop_control:
    label: "{{ item.0.path }}: {{ item.1 }}"
  notify: Restart sshd
