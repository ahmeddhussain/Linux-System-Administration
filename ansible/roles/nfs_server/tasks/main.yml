---
# NFSv4 on util01 for the workstations: home directories (D-058) and
# shared team directories (D-061). User quotas on the homes are set here.

- name: Install the NFS server
  ansible.builtin.dnf:
    name: nfs-utils
    state: present

# nfs-utils reads /etc/nfs.conf.d/*.conf, but RHEL does not create it.
- name: Create the NFS configuration drop-in directory
  ansible.builtin.file:
    path: /etc/nfs.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Serve NFSv4 only (no v3, no UDP)
  ansible.builtin.copy:
    dest: /etc/nfs.conf.d/ahmed.conf
    content: |
      # Managed by Ansible (role: nfs_server). NFSv4 over TCP only (D-058).
      [nfsd]
      vers3=n
      udp=n
    owner: root
    group: root
    mode: "0644"
  notify: Restart the NFS server

- name: Export homes and team directories to the workstations only
  ansible.builtin.copy:
    dest: /etc/exports.d/ahmed-homes.exports
    content: |
      # Managed by Ansible (role: nfs_server). sec=sys, root squashed (D-058, D-061).
      {% for path in ['/export/home', '/export/teams'] %}
      {{ path }} {% for h in groups['role_workstation'] | sort %}{{ hostvars[h].ansible_host }}(rw,sync,sec=sys,root_squash,no_subtree_check) {% endfor %}

      {% endfor %}

    owner: root
    group: root
    mode: "0644"
  notify: Re-export

- name: Open NFS to the workstations only
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="{{ hostvars[item].ansible_host }}/32"
      port port="2049" protocol="tcp" accept
    zone: public
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ groups['role_workstation'] | sort }}"

- name: Enable and start the NFS server
  ansible.builtin.systemd_service:
    name: nfs-server
    enabled: true
    state: started

# One home per IPA user, from the identity data. Owners resolve through
# SSSD on util01, which is an IPA client.
- name: Create every IPA user's home directory
  ansible.builtin.file:
    path: "/export/home/{{ item.name }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ hostvars[groups['ipaservers'][0]].ipa_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: nfs_home_dirs

# Copy the files inside /etc/skel, not "/etc/skel/." itself: copying "."
# with cp -a also copies its mode (0755) onto the home, which let a
# squashed root read every home (found by test-lab.sh, 2026-11-01).
- name: Copy the default files into new home directories
  ansible.builtin.shell: >-
    find /etc/skel -mindepth 1 -maxdepth 1 -exec cp -a --no-clobber {} '/export/home/{{ item.item.name }}/' \; &&
    chown -R '{{ item.item.name }}:{{ item.item.name }}' '/export/home/{{ item.item.name }}'
  when: item.changed
  loop: "{{ nfs_home_dirs.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# Same for homes: files restored with old IPA numbers go back to the user
# whose home they are in.
- name: Give every file in a home back to its user
  ansible.builtin.shell: >-
    find '/export/home/{{ item.name }}' \( ! -user '{{ item.name }}' -o ! -group '{{ item.name }}' \)
    -printf 'fixed %p\n' -exec chown -h '{{ item.name }}:{{ item.name }}' {} +
  register: nfs_home_owners
  changed_when: "'fixed' in nfs_home_owners.stdout"
  loop: "{{ hostvars[groups['ipaservers'][0]].ipa_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Keep every home directory private
  ansible.builtin.file:
    path: "/export/home/{{ item.name }}"
    state: directory
    mode: "0700"
  loop: "{{ hostvars[groups['ipaservers'][0]].ipa_users }}"
  loop_control:
    label: "{{ item.name }}"

# Home quotas (D-061): the user's home_quota in identity.yml, or the default.
# xfs_quota reports limits in KiB; a limit is only set when it differs.
- name: Set each user's home quota
  vars:
    quota: "{{ item.home_quota | default(home_quota_default) }}"
    soft_k: "{{ (quota.soft | human_to_bytes / 1024) | int }}"
    hard_k: "{{ (quota.hard | human_to_bytes / 1024) | int }}"
  ansible.builtin.shell: |
    set -o pipefail
    have=$(xfs_quota -x -c 'report -u -N -b' /export/home | awk -v u='{{ item.name }}' '$1 == u {print $3, $4}')
    if [ "$have" != "{{ soft_k }} {{ hard_k }}" ]; then
      xfs_quota -x -c 'limit -u bsoft={{ soft_k }}k bhard={{ hard_k }}k {{ item.name }}' /export/home
      echo "set {{ soft_k }} {{ hard_k }}"
    fi
  args:
    executable: /bin/bash
  register: nfs_home_quota
  changed_when: "'set ' in nfs_home_quota.stdout"
  loop: "{{ hostvars[groups['ipaservers'][0]].ipa_users }}"
  loop_control:
    label: "{{ item.name }}: {{ quota.soft }} / {{ quota.hard }}"

- name: Apply SELinux labels to the home directories
  ansible.builtin.command: restorecon -Rv /export/home
  register: nfs_home_restorecon
  changed_when: nfs_home_restorecon.stdout | length > 0

- name: Apply export changes
  ansible.builtin.meta: flush_handlers

- name: Confirm the running server has NFSv3 turned off
  ansible.builtin.command: cat /proc/fs/nfsd/versions
  register: nfs_home_versions
  changed_when: false
  check_mode: false
  failed_when: "'-3' not in nfs_home_versions.stdout.split()"

- name: Confirm the export is active for every workstation
  ansible.builtin.command: exportfs -s
  register: nfs_home_exports
  changed_when: false
  check_mode: false
  failed_when: >-
    '/export/teams' not in nfs_home_exports.stdout or
    groups['role_workstation'] | map('extract', hostvars, 'ansible_host')
    | reject('in', nfs_home_exports.stdout) | list | length > 0
