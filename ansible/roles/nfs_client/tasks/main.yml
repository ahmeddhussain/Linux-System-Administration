---
# Workstations mount IPA users' homes (D-058) and the team directories
# (D-061) from util01 with autofs. The maps live in IPA (identity.yml);
# SSSD serves them to autofs.

- name: Let processes use home directories on NFS (SELinux)
  ansible.posix.seboolean:
    name: use_nfs_home_dirs
    state: true
    persistent: true

- name: Install autofs
  ansible.builtin.dnf:
    name: autofs
    state: present

# The marker is SSSD's automount location: RHEL's standard SSSD profile
# already lists "sss" for automount in nsswitch.conf, so that line does not
# show whether ipa-client-automount ran (it had not, 2026-11-01).
- name: Check whether automount maps already come from IPA
  ansible.builtin.command: grep -qE '^ipa_automount_location\s*=' /etc/sssd/sssd.conf
  register: nfs_client_nss
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read automount maps from IPA (location {{ hostvars[groups['ipaservers'][0]].ipa_automount_location }})
  ansible.builtin.command: >-
    ipa-client-automount --unattended
    --location={{ hostvars[groups['ipaservers'][0]].ipa_automount_location }}
  when: nfs_client_nss.rc != 0

- name: Enable and start autofs
  ansible.builtin.systemd_service:
    name: autofs
    enabled: true
    state: started

- name: Confirm autofs knows the home and team directory maps
  ansible.builtin.command: automount -m
  register: nfs_client_maps
  changed_when: false
  check_mode: false
  failed_when: >-
    hostvars[groups['ipaservers'][0]].ipa_homes_root not in nfs_client_maps.stdout or
    hostvars[groups['ipaservers'][0]].ipa_teams_root not in nfs_client_maps.stdout
