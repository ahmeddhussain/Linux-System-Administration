---
# Central rsyslog on util01 (D-059). Runs before log_forwarder, which also
# gives util01 its certificate and forwards util01's own logs here.

- name: Install the rsyslog TLS driver
  ansible.builtin.dnf:
    name: rsyslog-openssl
    state: present

- name: Let the security team read the log directory
  ansible.builtin.file:
    path: "{{ log_dir }}"
    state: directory
    owner: root
    group: "{{ log_reader_group }}"
    mode: "0750"

# rsyslog.service sets UMask=0066, which turned the 0750/0640 modes into
# 0710/0600 and locked the security team out (2026-11-02).
- name: Create the rsyslog service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/rsyslog.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Let rsyslog create group-readable files
  ansible.builtin.copy:
    dest: /etc/systemd/system/rsyslog.service.d/ahmed-umask.conf
    content: |
      # Managed by Ansible (role: log_server) (D-059)
      [Service]
      UMask=0027
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for rsyslog
    - Restart rsyslog

- name: Correct the modes of logs written before that
  ansible.builtin.shell: |
    find {{ log_dir }} -mindepth 1 -type d ! -perm 0750 -printf 'fixed %p\n' -exec chmod 0750 {} +
    find {{ log_dir }} -mindepth 1 -type f ! -perm 0640 -printf 'fixed %p\n' -exec chmod 0640 {} +
  register: log_server_modes
  changed_when: "'fixed' in log_server_modes.stdout"

# A restore from a backup made before names were stored brings back the
# old IPA group number (2026-11-02); give the logs back to the reader group.
- name: Give every central log back to the reader group
  ansible.builtin.shell: >-
    find {{ log_dir }} -mindepth 1 ! -group {{ log_reader_group }}
    -printf 'fixed %p\n' -exec chgrp -h {{ log_reader_group }} {} +
  register: log_server_groups
  changed_when: "'fixed' in log_server_groups.stdout"

- name: Receive logs over TLS and store them per host
  ansible.builtin.template:
    src: 20-ahmed-server.conf.j2
    dest: /etc/rsyslog.d/20-ahmed-server.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart rsyslog

- name: Rotate the central logs (older copies live in the S3 backups)
  ansible.builtin.copy:
    dest: /etc/logrotate.d/ahmed-central-logs
    content: |
      # Managed by Ansible (role: log_server) (D-059)
      {{ log_dir }}/*/*.log {
          daily
          rotate {{ log_retention_days }}
          compress
          delaycompress
          missingok
          notifempty
          sharedscripts
          postrotate
              /usr/bin/systemctl kill -s HUP rsyslog.service >/dev/null 2>&1 || true
          endscript
      }
    owner: root
    group: root
    mode: "0644"

# Daily audit summary for the security team (D-063).
- name: Create the audit report directory
  ansible.builtin.file:
    path: "{{ log_dir }}/reports"
    state: directory
    owner: root
    group: "{{ log_reader_group }}"
    mode: "0750"

- name: Install the audit report script
  ansible.builtin.template:
    src: ahmed-audit-report.sh.j2
    dest: /usr/local/sbin/ahmed-audit-report
    owner: root
    group: root
    mode: "0750"

- name: Install the audit report service and its hourly timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: ahmed-audit-report.service
      content: |
        # Managed by Ansible (role: log_server)
        [Unit]
        Description=Write today's audit summary for every host (D-063)

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/ahmed-audit-report
    - name: ahmed-audit-report.timer
      content: |
        # Managed by Ansible (role: log_server)
        # Hourly, not daily: the lab rarely lives through a night (D-063).
        [Unit]
        Description=Hourly refresh of today's audit summary

        [Timer]
        OnCalendar=hourly
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

- name: Apply systemd changes
  ansible.builtin.meta: flush_handlers

- name: Enable the audit report timer
  ansible.builtin.systemd_service:
    name: ahmed-audit-report.timer
    enabled: true
    state: started

# Space guard: rsyslog loses messages it cannot write (DRILL-002).
- name: Install the log space guard
  ansible.builtin.template:
    src: ahmed-logspace.sh.j2
    dest: /usr/local/sbin/ahmed-logspace
    owner: root
    group: root
    mode: "0750"

- name: Install the log space guard service and its timer (every 5 minutes)
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: ahmed-logspace.service
      content: |
        # Managed by Ansible (role: log_server)
        [Unit]
        Description=Keep the central log volume below {{ log_space_high_pct }}% (DRILL-002)

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/ahmed-logspace
    - name: ahmed-logspace.timer
      content: |
        # Managed by Ansible (role: log_server)
        [Unit]
        Description=Check the central log volume every 5 minutes

        [Timer]
        OnCalendar=*:0/5
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

- name: Apply systemd changes (space guard)
  ansible.builtin.meta: flush_handlers

- name: Enable the log space guard
  ansible.builtin.systemd_service:
    name: ahmed-logspace.timer
    enabled: true
    state: started

- name: Open the log port to the VPC only
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4" source address="10.0.0.0/16"
      port port="{{ log_server_port }}" protocol="tcp" accept
    zone: public
    permanent: true
    immediate: true
    state: enabled
