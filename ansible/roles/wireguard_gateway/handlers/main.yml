---
# Validate the permanent configuration first: a bad file must never be
# loaded (a failed reload keeps the running rules, but say why).
- name: Reload firewalld
  ansible.builtin.shell: firewall-cmd --check-config && firewall-cmd --reload

- name: Restart WireGuard
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_interface }}"
    state: restarted

- name: Restart wstunnel
  ansible.builtin.systemd_service:
    name: wstunnel
    state: restarted
    daemon_reload: true