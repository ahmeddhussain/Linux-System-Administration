---
- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload

- name: Restart WireGuard
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_interface }}"
    state: restarted

- name: Restart wstunnel
  ansible.builtin.systemd_service:
    name: wstunnel
    state: restarted
    daemon_reload: true