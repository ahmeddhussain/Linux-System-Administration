---
- name: Refuse to run without peers
  ansible.builtin.assert:
    that:
      - wireguard_peers | length > 0
    fail_msg: "No VPN peers defined. Add them to inventory/group_vars/role_gateway/main.yml"
    quiet: true

- name: Refuse to run with missing or placeholder peer keys
  ansible.builtin.assert:
    that:
      - item.public_key is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: "Peer {{ item.name }} has no valid public key in inventory/group_vars/role_gateway/main.yml"
    quiet: true
  loop: "{{ wireguard_peers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Refuse to run without the server private key from the vault
  ansible.builtin.assert:
    that:
      - wireguard_server_private_key is match('^[A-Za-z0-9+/]{43}=$')
    fail_msg: "wireguard_server_private_key is missing or invalid. Check inventory/group_vars/role_gateway/vault.yml"
    quiet: true
  no_log: true

- name: Install the WireGuard tools and wstunnel
  ansible.builtin.include_tasks: tools.yml

- name: Load the WireGuard kernel module now
  ansible.builtin.command: modprobe wireguard
  changed_when: false

- name: Load the WireGuard kernel module at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/wireguard.conf
    content: "wireguard\n"
    owner: root
    group: root
    mode: "0644"

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/99-wireguard-forward.conf
    sysctl_set: true
    reload: true
    state: present

- name: Create the WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Derive the server public key
  ansible.builtin.command: wg pubkey
  args:
    stdin: "{{ wireguard_server_private_key }}"
  register: wireguard_server_pubkey
  changed_when: false
  check_mode: false
  no_log: true

# A wrong vault key would silently break every client, so stop before
# installing it.
- name: Refuse a vault key that does not match the recorded public key
  ansible.builtin.assert:
    that:
      - wireguard_server_pubkey.stdout == wireguard_server_public_key
    fail_msg: >-
      The vault key gives public key {{ wireguard_server_pubkey.stdout }}, but
      wireguard_server_public_key is {{ wireguard_server_public_key }}.
      Fix vault.yml, or update both on purpose when rotating the key.
    quiet: true

- name: Install the server private key from the vault
  ansible.builtin.copy:
    dest: /etc/wireguard/server.key
    content: "{{ wireguard_server_private_key }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart WireGuard

- name: Publish the server public key for client configurations
  ansible.builtin.copy:
    dest: /etc/wireguard/server.pub
    content: "{{ wireguard_server_pubkey.stdout }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Write the tunnel configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart WireGuard

- name: Close WireGuard's own UDP port to the outside (it is reached through wstunnel)
  ansible.posix.firewalld:
    port: "{{ wireguard_port }}/udp"
    zone: public
    permanent: true
    immediate: true
    state: disabled

- name: Allow the wstunnel port through the host firewall
  ansible.posix.firewalld:
    port: "{{ wstunnel_port }}/tcp"
    zone: public
    permanent: true
    immediate: true
    state: enabled

# Per-team VPN policy (D-052 to D-054). The zones and policies are whole
# files, so a rule removed from vpn_team_policy also disappears from gw01.
# This replaces the single trusted-zone binding (D-038) and vpn_to_vpc.
- name: Refuse a VPN policy that names a host missing from the inventory
  ansible.builtin.assert:
    that:
      - hostvars[item.1.host] is defined
      - hostvars[item.1.host].ansible_host is defined
    fail_msg: "vpn_team_policy {{ item.0.key }}: host {{ item.1.host }} is not in the inventory"
    quiet: true
  loop: "{{ vpn_team_policy | dict2items | subelements('value.allow') }}"
  loop_control:
    label: "{{ item.0.key }} -> {{ item.1.host }}:{{ item.1.port }}"

- name: Take the tunnel interface out of the old trusted zone
  ansible.posix.firewalld:
    interface: "{{ wireguard_interface }}"
    zone: trusted
    permanent: true
    immediate: true
    state: disabled
  notify: Reload firewalld

- name: Remove the old allow-everything forwarding policy
  ansible.builtin.file:
    path: /etc/firewalld/policies/vpn_to_vpc.xml
    state: absent
  notify: Reload firewalld

- name: Create the firewalld policy directory
  ansible.builtin.file:
    path: /etc/firewalld/policies
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write the tunnel interface zone (drops anything not from a team range)
  ansible.builtin.template:
    src: vpn-interface-zone.xml.j2
    dest: /etc/firewalld/zones/vpn.xml
    owner: root
    group: root
    mode: "0644"
  notify: Reload firewalld

- name: Write one zone per team VPN range
  ansible.builtin.template:
    src: vpn-zone.xml.j2
    dest: "/etc/firewalld/zones/vpn-{{ item.key }}.xml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ vpn_team_policy | dict2items }}"
  loop_control:
    label: "vpn-{{ item.key }} ({{ item.value.cidr }})"
  notify: Reload firewalld

- name: Write one forwarding policy per team
  ansible.builtin.template:
    src: vpn-policy.xml.j2
    dest: "/etc/firewalld/policies/vpn-{{ item.key }}-to-vpc.xml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ vpn_team_policy | dict2items }}"
  loop_control:
    label: "vpn-{{ item.key }}-to-vpc"
  notify: Reload firewalld

- name: Restart wstunnel when its binary changed
  ansible.builtin.debug:
    msg: "wstunnel binary updated"
  when: wireguard_wstunnel_binary.changed
  changed_when: true
  notify: Restart wstunnel

- name: Install the wstunnel service
  ansible.builtin.template:
    src: wstunnel.service.j2
    dest: /etc/systemd/system/wstunnel.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart wstunnel

- name: Apply pending firewall, tunnel, and wstunnel changes before starting services
  ansible.builtin.meta: flush_handlers

- name: Enable and start the tunnel
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started

- name: Enable and start wstunnel
  ansible.builtin.systemd_service:
    name: wstunnel
    enabled: true
    state: started
    daemon_reload: true

- name: Confirm the running tunnel has every configured peer
  ansible.builtin.shell: "wg show {{ wireguard_interface }} peers | wc -l"
  register: wireguard_running_peers
  changed_when: false
  check_mode: false
  failed_when: (wireguard_running_peers.stdout | int) != (wireguard_peers | length)

- name: Confirm the tunnel interface is in the vpn zone
  ansible.builtin.command: "firewall-cmd --get-zone-of-interface={{ wireguard_interface }}"
  register: wireguard_wg_zone
  changed_when: false
  check_mode: false
  failed_when: wireguard_wg_zone.stdout != 'vpn'

- name: Confirm every team's forwarding policy is active
  ansible.builtin.command: firewall-cmd --get-active-policies
  register: wireguard_active_policies
  changed_when: false
  check_mode: false
  failed_when: >-
    (vpn_team_policy.keys() | map('regex_replace', '^', 'vpn-') | map('regex_replace', '$', '-to-vpc') | list)
    | difference(wireguard_active_policies.stdout_lines | map('trim') | list) | length > 0

- name: Confirm wstunnel is listening
  ansible.builtin.command: "ss -Htln sport = :{{ wstunnel_port }}"
  register: wstunnel_listen
  changed_when: false
  check_mode: false
  failed_when: wstunnel_listen.stdout | length == 0

- name: Show the server public key
  ansible.builtin.debug:
    msg: "WireGuard server public key: {{ wireguard_server_pubkey.stdout }}"