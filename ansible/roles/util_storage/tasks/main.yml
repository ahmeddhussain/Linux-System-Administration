---
# util01 data volume (LVM) and its backups to S3 (D-056).

- name: Install LVM and the AWS CLI
  ansible.builtin.dnf:
    name: [lvm2, awscli2]
    state: present

# Data disks are the unpartitioned NVMe disks (the root disk has
# partitions). Refuse to guess if the count differs from Terraform's.
- name: Find the data disks
  ansible.builtin.set_fact:
    util_storage_disks: >-
      {{ ansible_devices | dict2items
         | selectattr('key', 'match', '^nvme')
         | selectattr('value.partitions', 'equalto', {})
         | map(attribute='key') | sort | list }}

- name: Refuse to continue unless the expected data disks are present
  ansible.builtin.assert:
    that:
      - util_storage_disks | length == util_storage_disk_count
    fail_msg: "Expected {{ util_storage_disk_count }} data disks, found: {{ util_storage_disks }}"
    quiet: true

- name: Check whether the volume group already exists
  ansible.builtin.command: "vgs {{ util_storage_vg }}"
  register: util_storage_vgs
  changed_when: false
  failed_when: false
  check_mode: false

- name: List the disks already in the volume group
  ansible.builtin.command: "pvs --noheadings -o pv_name -S vg_name={{ util_storage_vg }}"
  register: util_storage_pvs
  changed_when: false
  failed_when: false
  check_mode: false

# Only blank disks are ever added: a disk with any signature (filesystem,
# LVM label from elsewhere) stops the run instead of being overwritten.
- name: Check that disks not yet in the volume group are blank
  ansible.builtin.command: "wipefs --no-act --noheadings /dev/{{ item }}"
  register: util_storage_wipefs
  changed_when: false
  check_mode: false
  failed_when: util_storage_wipefs.stdout | length > 0
  loop: "{{ util_storage_disks | reject('in', util_storage_pvs.stdout | split | map('regex_replace', '^/dev/', '') | list) | list }}"

- name: Create the volume group on the data disks (new volumes only)
  ansible.builtin.command: "vgcreate {{ util_storage_vg }} {{ util_storage_disks | map('regex_replace', '^', '/dev/') | join(' ') }}"
  when: util_storage_vgs.rc != 0
  register: util_storage_vg_created

- name: Add new data disks to the volume group
  ansible.builtin.command: "vgextend {{ util_storage_vg }} /dev/{{ item.item }}"
  when: util_storage_vgs.rc == 0
  loop: "{{ util_storage_wipefs.results | default([]) }}"
  loop_control:
    label: "/dev/{{ item.item }}"

- name: Create one logical volume per data area
  ansible.builtin.command: >-
    lvcreate --yes --name lv_{{ item.key }} --size {{ item.value.size }} {{ util_storage_vg }}
  args:
    creates: "/dev/{{ util_storage_vg }}/lv_{{ item.key }}"
  loop: "{{ util_storage_volumes | dict2items }}"
  loop_control:
    label: "lv_{{ item.key }} ({{ item.value.size }})"

- name: Grow logical volumes that are smaller than wanted (and their filesystem)
  ansible.builtin.shell: >-
    want=$(numfmt --from=iec {{ item.value.size }});
    have=$(lvs --noheadings --units b --nosuffix -o lv_size {{ util_storage_vg }}/lv_{{ item.key }} | tr -d ' ');
    if [ "$have" -lt "$want" ]; then
    lvextend --resizefs --size {{ item.value.size }} {{ util_storage_vg }}/lv_{{ item.key }} > /dev/null && echo grown; fi
  register: util_storage_grow
  changed_when: "'grown' in util_storage_grow.stdout"
  loop: "{{ util_storage_volumes | dict2items }}"
  loop_control:
    label: "lv_{{ item.key }} -> {{ item.value.size }}"

- name: Check for a filesystem on each logical volume
  ansible.builtin.command: "blkid -o value -s TYPE /dev/{{ util_storage_vg }}/lv_{{ item.key }}"
  register: util_storage_fs
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ util_storage_volumes | dict2items }}"
  loop_control:
    label: "lv_{{ item.key }}"

- name: Create an XFS filesystem where there is none
  ansible.builtin.command: "mkfs.xfs /dev/{{ util_storage_vg }}/lv_{{ item.item.key }}"
  when: item.stdout == ''
  loop: "{{ util_storage_fs.results }}"
  loop_control:
    label: "lv_{{ item.item.key }}"

- name: Mount each data area permanently
  ansible.posix.mount:
    path: "{{ item.value.mount }}"
    src: "/dev/{{ util_storage_vg }}/lv_{{ item.key }}"
    fstype: xfs
    opts: "{{ item.value.opts }}"
    state: mounted
  loop: "{{ util_storage_volumes | dict2items }}"
  loop_control:
    label: "{{ item.value.mount }}"

# XFS cannot switch quotas on with a remount; an existing mount without
# them is unmounted and mounted again (NFS is stopped for a moment).
- name: Switch quota accounting on where wanted (remount if needed)
  ansible.builtin.shell: |
    set -e
    state=$(xfs_quota -x -c 'state -{{ 'u' if item.value.opts == 'uquota' else 'p' }}' {{ item.value.mount }})
    if echo "$state" | grep -q 'Accounting: ON' && echo "$state" | grep -q 'Enforcement: ON'; then exit 0; fi
    nfs=$(systemctl is-active nfs-server || true)
    if [ "$nfs" = active ]; then systemctl stop nfs-server; fi
    umount {{ item.value.mount }}
    mount {{ item.value.mount }}
    if [ "$nfs" = active ]; then systemctl start nfs-server; fi
    echo remounted
  args:
    executable: /bin/bash
  register: util_storage_quota
  changed_when: "'remounted' in util_storage_quota.stdout"
  when: item.value.opts != 'defaults'
  loop: "{{ util_storage_volumes | dict2items }}"
  loop_control:
    label: "{{ item.value.mount }} ({{ item.value.opts }})"

- name: Remove a plain SELinux type rule where the area copies another path's labels
  ansible.builtin.shell: >-
    if semanage fcontext -l -C | grep -qF '{{ item.value.mount }}(/.*)?'; then
    semanage fcontext -d '{{ item.value.mount }}(/.*)?' && echo removed; fi
  register: util_storage_fcontext_old
  changed_when: "'removed' in util_storage_fcontext_old.stdout"
  when: item.value.selinux_like is defined
  loop: "{{ util_storage_volumes | dict2items }}"
  loop_control:
    label: "{{ item.value.mount }}"

- name: Label each data area like the path it copies (equivalence)
  ansible.builtin.shell: >-
    semanage fcontext -l -C | grep -qE '^{{ item.value.mount }} = {{ item.value.selinux_like }}$' ||
    { semanage fcontext -a -e {{ item.value.selinux_like }} {{ item.value.mount }} && echo added; }
  register: util_storage_fcontext_eq
  changed_when: "'added' in util_storage_fcontext_eq.stdout"
  when: item.value.selinux_like is defined
  loop: "{{ util_storage_volumes | dict2items }}"
  loop_control:
    label: "{{ item.value.mount }} = {{ item.value.selinux_like | default('') }}"

- name: Record the SELinux type of the other data areas
  ansible.builtin.shell: >-
    semanage fcontext -l | grep -qF '{{ item.value.mount }}(/.*)?' ||
    { semanage fcontext -a -t {{ item.value.setype }} '{{ item.value.mount }}(/.*)?' && echo added; }
  register: util_storage_fcontext
  changed_when: "'added' in util_storage_fcontext.stdout"
  when: item.value.setype is defined
  loop: "{{ util_storage_volumes | dict2items }}"
  loop_control:
    label: "{{ item.value.mount }} -> {{ item.value.setype | default('') }}"

- name: Apply the SELinux types
  ansible.builtin.command: "restorecon -Rv {{ item.value.mount }}"
  register: util_storage_restorecon
  changed_when: util_storage_restorecon.stdout | length > 0
  loop: "{{ util_storage_volumes | dict2items }}"
  loop_control:
    label: "{{ item.value.mount }}"

- name: Install the backup script
  ansible.builtin.template:
    src: ahmed-backup.sh.j2
    dest: /usr/local/sbin/ahmed-backup
    owner: root
    group: root
    mode: "0750"

- name: Install the backup service and its daily timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - name: ahmed-backup.service
      content: |
        # Managed by Ansible (role: util_storage)
        [Unit]
        Description=Back up util01 data to S3 (D-056)
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/ahmed-backup backup
    - name: ahmed-backup.timer
      content: |
        # Managed by Ansible (role: util_storage)
        [Unit]
        Description=Daily backup of util01 data to S3

        [Timer]
        OnCalendar={{ util_backup_time }}
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd

- name: Apply systemd changes
  ansible.builtin.meta: flush_handlers

- name: Enable the backup timer
  ansible.builtin.systemd_service:
    name: ahmed-backup.timer
    enabled: true
    state: started

# Restore only onto a volume group created in this run: never overwrite
# data that is already here.
- name: Restore the latest backup onto the new volume
  ansible.builtin.command: /usr/local/sbin/ahmed-backup restore
  register: util_storage_restore
  failed_when: util_storage_restore.rc not in [0, 3]
  changed_when: util_storage_restore.rc == 0
  when: util_storage_vg_created is changed

- name: Show the restore result
  ansible.builtin.debug:
    msg: "{{ util_storage_restore.stdout }}"
  when: util_storage_vg_created is changed
