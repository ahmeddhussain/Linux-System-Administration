---
# util01 data volume and backups (D-056).
util_storage_vg: vg_data
# name: size, mount point, and either an SELinux type (setype) or a path
# whose labels it copies (selinux_like). NFS homes copy /home, so every
# user directory gets the user home type (D-058).
util_storage_volumes:
  home: { size: 10G, mount: /export/home, selinux_like: /home }
  logs: { size: 6G, mount: /srv/logs, setype: var_log_t }

# Backups go to the bucket made by terraform/persistent; its name ends with
# the account ID, which the script looks up at run time.
util_backup_bucket_prefix: ahmed-infra-backups
util_backup_key: util01/latest.tar.gz
util_backup_region: us-east-1
util_backup_time: "*-*-* 02:00:00"
