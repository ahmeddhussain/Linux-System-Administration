---
# Workstations have no direct internet (D-057); their only way to package
# repositories is Squid on util01. So on a new lab util01 is patched and gets
# Squid first, then workstations are pointed at it, then everything else is
# patched (INC-004: a fresh build hung on the first dnf task).
- name: Patch util01 first
  ansible.builtin.import_playbook: patch.yml
  vars:
    patch_hosts: role_util

- name: util01 baseline and web proxy, before any workstation needs packages
  hosts: role_util
  roles:
    - base
    - web_proxy

- name: Workstations send dnf through the proxy from the start
  hosts: role_workstation
  tasks:
    - name: dnf proxy setting
      ansible.builtin.include_role:
        name: proxy_client
        tasks_from: dnf

- name: Patch every other host to the same level
  ansible.builtin.import_playbook: patch.yml
  vars:
    patch_hosts: "all:!role_util"

- name: Baseline configuration for every host
  hosts: all
  roles:
    - base

- name: Central identity (FreeIPA server, then clients)
  ansible.builtin.import_playbook: idm.yml

- name: Utility server data volume and backups (D-056)
  hosts: role_util
  roles:
    - util_storage

- name: Central log server on util01 (D-059)
  hosts: role_util
  roles:
    - log_server

- name: Every host sends its logs to util01 over TLS (D-059)
  hosts: all
  roles:
    - log_forwarder

- name: NFS home directories on util01 (D-058)
  hosts: role_util
  roles:
    - nfs_home_server

- name: Workstations mount home directories from util01 (D-058)
  hosts: role_workstation
  roles:
    - nfs_home_client

- name: Web proxy on util01 (D-057)
  hosts: role_util
  roles:
    - web_proxy

- name: Workstations use the web proxy (D-057)
  hosts: role_workstation
  roles:
    - proxy_client

- name: VPN gateway
  hosts: role_gateway
  roles:
    - wireguard_gateway

- name: Tools for the per-team VPN test peers on control01 (D-055)
  hosts: role_control
  tasks:
    - name: WireGuard tools and the pinned wstunnel binary
      ansible.builtin.include_role:
        name: wireguard_gateway
        tasks_from: tools
