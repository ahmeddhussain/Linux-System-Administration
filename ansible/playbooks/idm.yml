---
# FreeIPA (D-046 to D-051): server on idm01, then every other host enrolls,
# then the identity data, then per-client settings that follow it.
# control01 enrolls last, alone, because it runs this playbook.
#
# state: present is passed to the collection's roles on purpose. The AWS
# dynamic inventory defines a host variable "state" (the instance state),
# which the ipaserver/ipaclient roles also use to choose install or
# UNINSTALL. A role parameter outranks inventory variables.

- name: FreeIPA server
  hosts: ipaservers
  roles:
    - role: freeipa.ansible_freeipa.ipaserver
      state: present
    - ipa_server_verify

- name: FreeIPA clients (all hosts except idm01 and control01)
  hosts: ipaclients:!role_control
  serial: 2
  roles:
    - ipa_client_prepare
    - role: freeipa.ansible_freeipa.ipaclient
      state: present
    - ipa_client_health

- name: FreeIPA client on control01 (last, alone)
  hosts: ipaclients:&role_control
  roles:
    - ipa_client_prepare
    - role: freeipa.ansible_freeipa.ipaclient
      state: present
    - ipa_client_health

- name: FreeIPA identity data (groups, users, host groups, HBAC, sudo)
  hosts: ipaservers
  gather_facts: false
  roles:
    - ipa_identity

- name: IPA client health and settings that follow the identity data
  hosts: ipaclients
  serial: 3
  roles:
    - ipa_client_health
    - ipa_client_config
