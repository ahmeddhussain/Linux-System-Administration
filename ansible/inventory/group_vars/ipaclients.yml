---
# FreeIPA clients: every host except idm01 (D-051).
ipaclient_domain: "{{ ipa_domain }}"
ipaclient_realm: "{{ ipa_realm }}"
# Full names are required: the role's default is the inventory names
# ("idm01"), and IPA's web server redirects short names, so the CA download
# came back empty and enrollment failed (2026-11-01).
ipaclient_servers: "{{ groups['ipaservers'] | map('regex_replace', '$', '.' ~ ipa_domain) | list }}"

# Enrollment uses a one-time password that playbooks/idm.yml registers on
# idm01 for each host (ipaclient_otp). The admin password is used only on
# idm01 and is never defined for, or sent to, a client.

# Point the resolver at idm01 before enrolling (D-047). The VPC resolver is
# second: it is used only if idm01 does not answer.
ipaclient_configure_dns_resolver: true
ipaclient_dns_servers:
  - "{{ hostvars[groups['ipaservers'][0]].ansible_host }}"
  - 10.0.0.2

# Publish SSH host keys as SSHFP records and let ssh look them up (D-036).
ipasssd_enable_dns_updates: true
ipaclient_ssh_trust_dns: true
