---
ansible_user: ansible
ansible_ssh_private_key_file: ~/.ssh/ansible_ed25519

# FreeIPA (D-046 to D-051). Shared by the server and every client.
ipa_domain: ahmed.internal
ipa_realm: AHMED.INTERNAL
# Time comes from the AWS time sync service already configured in chrony
# (base role); IPA must not repoint chrony.
ipaclient_no_ntp: true
# Create a home directory on first login (NFS homes come later, util01).
ipaclient_mkhomedir: true

# Web proxy (D-057): Squid on util01, one port per policy. Workstations
# reach the web only through it; each user may use only their team's port.
web_proxy_host: util01.ahmed.internal
web_proxy_ports:
  standard: 3128    # everything over HTTPS except the deny lists
  allowlist: 3129   # only the allow-listed domains
# Policy per IPA team group (identity.yml). Teams not listed get "standard".
web_proxy_team_policy:
  dba: allowlist
  contractors: allowlist
