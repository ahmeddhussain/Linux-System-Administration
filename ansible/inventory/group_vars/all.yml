---
ansible_user: ansible
ansible_ssh_private_key_file: ~/.ssh/ansible_ed25519

# FreeIPA (D-046 to D-051). Shared by the server and every client.
ipa_domain: ahmed.internal
ipa_realm: AHMED.INTERNAL
# Time comes from the AWS time sync service already configured in chrony
# (base role); IPA must not repoint chrony.
ipaclient_no_ntp: true
# Create a home directory on first login (NFS homes come later, util01).
ipaclient_mkhomedir: true

# Web proxy (D-057): Squid on util01, one port per policy. Workstations
# reach the web only through it; each user may use only their team's port.
web_proxy_host: util01.ahmed.internal
web_proxy_ports:
  standard: 3128    # everything over HTTPS except the deny lists
  allowlist: 3129   # only the allow-listed domains
# Policy per IPA team group (identity.yml). Teams not listed get "standard".
web_proxy_team_policy:
  dba: allowlist
  contractors: allowlist

# Compliance (D-064): minimum OpenSCAP CIS Level 1 score per host role.
# Raised as findings are fixed, never lowered; a host below it fails the
# tests. Baseline from the first scan, 2026-11-03 (no fixes yet), rounded down.
compliance_min_score:
  gateway: 74       # 74.36
  control: 74       # 74.36
  idm: 71           # 71.03
  util: 70          # 70.44
  workstation: 72   # 72.85

# Compliance exceptions (D-064): CIS rules this design deliberately does not
# meet. Each becomes a "not selected" rule in the host's tailoring file, so
# it no longer counts against the score. roles: host roles it applies to
# ("all" for every host).
compliance_exceptions:
  grub2_password:
    roles: [all]
    reason: "EC2 has no boot console a person could reach; a password only hinders recovery"
  ensure_root_password_configured:
    roles: [all]
    reason: "root stays locked; logins are key-only and break-glass is Instance Connect (D-026)"
  sshd_limit_user_access:
    roles: [all]
    reason: "IPA HBAC rules decide who may log in where (D-048, D-050); AllowGroups would duplicate them"
  ensure_journald_and_rsyslog_not_active_together:
    roles: [all]
    reason: "rsyslog reads the journal and forwards over TLS to util01 (D-059, D-063)"
  package_systemd-journal-remote_installed:
    roles: [all]
    reason: "central logging is rsyslog over TLS, not journal-remote (D-059)"
  package_bind_removed:
    roles: [idm]
    reason: "FreeIPA integrated DNS runs on bind (D-047)"
  package_httpd_removed:
    roles: [idm]
    reason: "FreeIPA web UI and API run on httpd (D-046)"
  package_squid_removed:
    roles: [util]
    reason: "util01 is the company web proxy (D-057)"
  service_nfs_disabled:
    roles: [util]
    reason: "util01 serves NFS homes and team shares (D-058, D-061)"
  sysctl_net_ipv4_conf_all_forwarding:
    roles: [gateway]
    reason: "gw01 routes VPN traffic into the VPC (D-052)"
  sysctl_net_ipv4_conf_default_forwarding:
    roles: [gateway]
    reason: "gw01 routes VPN traffic into the VPC (D-052)"
  service_rpcbind_disabled:
    roles: [util, workstation]
    reason: "installed and started with the NFS server and client (D-058); revisit for NFSv4-only"
