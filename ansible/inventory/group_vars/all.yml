---
ansible_user: ansible
ansible_ssh_private_key_file: ~/.ssh/ansible_ed25519

# FreeIPA (D-046 to D-051). Shared by the server and every client.
ipa_domain: ahmed.internal
ipa_realm: AHMED.INTERNAL
# Time comes from the AWS time sync service already configured in chrony
# (base role); IPA must not repoint chrony.
ipaclient_no_ntp: true
# Create a home directory on first login (NFS homes come later, util01).
ipaclient_mkhomedir: true
